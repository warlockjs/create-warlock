name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # The scaffold job installs the framework from the registry, so it can go red
  # without anyone touching this repo — a framework release is enough. The
  # nightly run is what turns that from "the next contributor discovers it" into
  # "we find out the day it happens".
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  specs:
    name: Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - run: pnpm install --frozen-lockfile

      - name: Check resolver boundaries
        run: node scripts/check-resolver-boundaries.mjs

      # The template's own formatting, checked with the template's own config —
      # the same config the scaffolded project receives. Without this, an
      # unformatted template file reaches the user and their first `warlock dev`
      # reports it as an error.
      - name: Check template formatting
        run: node scripts/format-check-template.mjs

      - name: Smoke CLI version
        run: |
          actual="$(./node_modules/.bin/tsx src/index.ts --version)"
          expected="$(node -p "require('./package.json').version")"
          test "$actual" = "$expected"

      - name: Vitest
        run: npm test

  scaffold-typecheck:
    name: Fresh scaffold typechecks
    runs-on: ubuntu-latest
    # Scaffolding runs a full dependency install of the generated project on top
    # of this repo's own install.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - run: pnpm install --frozen-lockfile

      # Scaffolds a real project into a temp dir, installs it, and runs THAT
      # project's `tsc --noEmit`. Typechecking `templates/warlock/` in place
      # would prove nothing: it has no node_modules, so every framework type
      # would resolve to `any`. See the header of the script.
      - name: Typecheck a freshly scaffolded project
        run: npm run typecheck:scaffold
